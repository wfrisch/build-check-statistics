#
# Default configuration baked into the container image.
#
# The database must live under /var/lib/build_check_statistics, which is the
# directory intended to be mounted as a volume. Override this whole file by
# bind-mounting your own over /app/build_check_statistics.conf (see BCS_CONFIG
# in container.sh) -- MOJO_CONFIG does not work, because the application passes
# an explicit `file` option to the Config plugin, which takes precedence.
#
{
  obs      => 'https://build.opensuse.org/public',
  projects => ['Virtualization'],
  sqlite   => 'sqlite:/var/lib/build_check_statistics/rpmlint.db'
}
